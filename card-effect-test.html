<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>カード効果テスト | WS手動対戦盤面</title>
  <link rel="stylesheet" href="card-registration.css?v=3">
  <link rel="stylesheet" href="card-effect-test.css?v=3">
  <script src="card-catalog.js?v=3" defer></script>
  <script src="effects/engine.js?v=4" defer></script>
  <script src="card-data/load.js?v=2" defer></script>
  <script src="card-effect-test.js?v=6" defer></script>
</head>
<body>
  <header class="site-header"><div class="shell header-content">
    <h1 id="labTitle">カード効果テスト</h1>
    <a id="modeLink" href="card-effect-test.html?mode=solo&amp;card=STS%2FW140-001">壁打ちモード</a>
    <a href="card-registration.html">カード情報・効果登録</a>
  </div></header>
  <main class="shell">
    <section id="cardSelector" class="panel" aria-labelledby="testCardHeading">
      <h2 id="testCardHeading">テスト対象</h2>
      <div class="fields">
        <label>商品 <select id="testProduct"></select></label>
        <label>カード <select id="testCard"></select></label>
        <label>能力 <select id="testEffect" disabled></select></label>
      </div>
      <p id="testCardStatus" class="muted" role="status"></p>
      <p id="testEffectStatus" class="muted"></p>
      <blockquote id="effectText" class="effect-original" hidden></blockquote>
      <details><summary>カード番号で開く</summary><form id="testFind" class="row">
        <label class="grow">正式カード番号 <input id="testNumber" list="testNumbers" autocomplete="off" required></label>
        <datalist id="testNumbers"></datalist>
        <button type="submit">カードを開く</button>
      </form></details>
    </section>
    <section class="panel" aria-labelledby="testBoardHeading">
      <div class="section-heading"><h2 id="testBoardHeading">テスト盤面</h2><strong id="turnNumber"></strong></div>
      <div class="row">
        <button id="nextTurn" type="button">次のターンへ</button>
        <button id="loadFiren" type="button">フィレン・凱旋歌の確認用盤面</button>
        <button id="loadPractice" type="button" hidden>レイスの確認用盤面を配置</button>
        <button id="undoBoard" type="button">直前の配置を取り消す</button>
        <button id="resetEffectTest" type="button">盤面リセット</button>
      </div>
      <p id="turnUsed" class="muted"></p>
      <p id="soloHelp" hidden>手札のカードから「舞台に出す」を選びます。舞台のカードをタップすると、使える起動能力が表示されます。</p>
      <details><summary>カードを配置</summary>
        <form id="placeCard" class="lab-form">
          <label>カード <select id="placeNumber"></select></label>
          <fieldset id="mockFields" hidden>
            <legend>仮カードの情報</legend>
            <div class="fields">
              <label>名称 <input id="mockName" placeholder="仮カード"></label>
              <label>種類 <select id="mockType"><option value="character">キャラ</option><option value="event">イベント</option><option value="climax">CX</option></select></label>
              <label>レベル <input id="mockLevel" type="number" value="0" step="1"></label>
              <label>コスト <input id="mockCost" type="number" step="1"></label>
              <label>パワー <input id="mockPower" type="number" step="1"></label>
              <label>ソウル <input id="mockSoul" type="number" step="1"></label>
              <label>特徴 <input id="mockTraits" placeholder="読点またはカンマで区切る"></label>
              <label>キーワード能力 <input id="mockKeywords" placeholder="回想"></label>
              <label>トリガー <input id="mockTriggers"></label>
            </div>
          </fieldset>
          <div class="fields">
            <label>プレイヤー <select id="placeSide"></select></label>
            <label>領域 <select id="placeZone"></select></label>
            <label id="placeMarkerLabel" hidden>マーカーの持ち主 <select id="placeMarkerHost"></select></label>
            <label>枚数 <input id="placeCount" type="number" min="1" max="50" value="1" required></label>
          </div>
          <details><summary>特徴・キーワードの追加と無効化</summary>
            <div class="fields">
              <label>追加する特徴 <input id="traitsAdded"></label>
              <label>取り除く特徴 <input id="traitsRemoved"></label>
              <label>追加するキーワード能力 <input id="keywordsAdded"></label>
              <label>無効化するキーワード能力 <input id="keywordsDisabled"></label>
            </div>
          </details>
          <button type="submit">領域の上に追加</button>
        </form>
      </details>
      <div id="firenActions" class="row" hidden>
        <button id="checkTrigger" type="button">トリガーチェック</button>
        <button id="togglePracticeTurn" type="button">相手ターンのパワーを見る</button>
      </div>
      <p id="boardStatus" class="feedback" role="status"></p>
      <div id="boardEditor" class="lab-boards"></div>
      <form id="editCard" class="lab-form" hidden>
        <p id="editCardName"></p>
        <div class="fields">
          <label>移動する側 <select id="editSide"></select></label>
          <label>移動先 <select id="editZone"></select></label>
          <label id="editMarkerLabel" hidden>マーカーの持ち主 <select id="editMarkerHost"></select></label>
          <label>置く位置 <select id="editPosition"><option value="top">一番上</option><option value="bottom">一番下</option></select></label>
        </div>
        <div class="row"><button type="submit">選択したカードを移動</button><button id="removeCard" type="button" class="danger">選択したカードを削除</button></div>
      </form>
    </section>
    <section id="operationPanel" class="panel" aria-labelledby="choiceHeading">
      <h2 id="choiceHeading" tabindex="-1">能力操作</h2>
      <p id="operationDescription" class="muted"></p>
      <p id="expectedOutcome" hidden></p>
      <div id="effectChoices" aria-live="polite"></div>
      <blockquote id="soloEffectText" class="effect-original" hidden></blockquote>
      <div class="row">
        <button class="primary" id="runEffectTest" type="button" disabled>テスト開始</button>
        <button id="cancelEffect" type="button" hidden>テストを中止</button>
      </div>
    </section>
    <section class="panel" aria-labelledby="resultHeading">
      <h2 id="resultHeading" tabindex="-1">処理結果</h2>
      <p id="effectResult" role="status"></p>
      <div id="resultVerification" hidden></div>
      <div class="row">
        <button id="restoreStart" type="button" hidden>テスト開始時点へ戻す</button>
        <button id="repeatTest" type="button" hidden>同じ盤面で再実行</button>
      </div>
      <div id="resultChanges"></div>
      <details><summary>開発者向け情報</summary>
        <button id="loadSample" type="button">架空カードのテスト例を開く</button>
        <ul id="compareResults"></ul>
        <h3>処理履歴</h3><ol id="effectLog"></ol>
        <h3>実行前の盤面</h3><pre id="beforeBoard"></pre>
        <h3>実行後の盤面</h3><pre id="afterBoard"></pre>
      </details>
    </section>
  </main>
</body>
</html>
