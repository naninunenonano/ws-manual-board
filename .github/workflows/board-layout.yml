name: Board layout screenshots

on:
  push:
    branches: [feature/photo-board-layout]
  pull_request:
    paths: [index.html, auto-rules.js, bot-match.js, bot-deck-editor.js, stella-effects.js, frieren-effects.js, board-layout.css, match-state.js, decklog-import.js, cloud-decks.js, online-match.js, card-images.js, card-catalog.js, card-catalog-view.js, 'card-registration.*', 'card-effect-test.*', 'card-data/**', 'effects/**', 'supabase/**', 'test/**', '.github/workflows/board-layout.yml']

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test test/*.test.cjs
      - run: npm install --no-save --package-lock=false playwright@1.58.2 @electric-sql/pglite@0.5.17
      - run: command -v google-chrome || npx playwright install chromium
      - name: Install Japanese fonts for screenshots
        timeout-minutes: 2
        continue-on-error: true
        run: |
          if [ -z "$(fc-list :lang=ja)" ]; then
            sudo timeout 45s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=10 update -qq
            sudo timeout 45s apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=10 install -y -qq fonts-noto-cjk
          fi
      - run: node test/online-db.cjs
      - run: node test/online-browser.cjs
      - run: node test/board-layout.cjs
      - run: node test/card-registration-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: board-layout-390px
          path: layout-screenshots/*.png
